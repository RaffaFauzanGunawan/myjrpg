<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicles of the Fallen Crown</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow: hidden;
}

#game-container {
  position: relative;
  width: 960px;
  height: 640px;
}

#game-canvas {
  width: 960px;
  height: 640px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
}

#ui-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 960px;
  height: 640px;
  pointer-events: none;
}

#ui-overlay > * {
  pointer-events: auto;
}

.hidden {
  display: none !important;
}

/* Title Screen */
.title-screen {
  position: absolute;
  top: 0; left: 0;
  width: 960px; height: 640px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #0a0a1a 0%, #1a0a2e 30%, #2d1b4e 60%, #1a0a2e 100%);
  color: #fff;
  user-select: none;
}

.title-crown {
  font-size: 64px;
  margin-bottom: 8px;
  filter: drop-shadow(0 0 20px #d4af37);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.title-main {
  font-size: 36px;
  font-weight: bold;
  letter-spacing: 3px;
  text-shadow: 0 0 30px rgba(212,175,55,0.5);
  margin-bottom: 4px;
}

.title-sub {
  font-size: 18px;
  color: #c0a050;
  letter-spacing: 6px;
  margin-bottom: 48px;
}

.title-menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}

.title-menu button {
  background: transparent;
  border: 1px solid #c0a050;
  color: #e0c878;
  padding: 10px 48px;
  font-size: 16px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.3s;
  min-width: 220px;
  font-family: inherit;
}

.title-menu button:hover {
  background: rgba(212,175,55,0.2);
  border-color: #d4af37;
  color: #fff;
  text-shadow: 0 0 10px rgba(212,175,55,0.5);
}

.title-version {
  position: absolute;
  bottom: 16px;
  right: 24px;
  color: #555;
  font-size: 12px;
}

/* HUD */
.hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 48px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 100%);
  display: flex;
  align-items: center;
  padding: 0 16px;
  color: #fff;
  font-size: 13px;
}

.hud-party {
  display: flex;
  gap: 16px;
}

.hud-char {
  display: flex;
  align-items: center;
  gap: 6px;
}

.hud-char-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid #c0a050;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: bold;
}

.hud-bars {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.hud-bar {
  width: 80px;
  height: 6px;
  background: #333;
  border-radius: 3px;
  overflow: hidden;
}

.hud-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}

.hud-bar-hp .hud-bar-fill { background: linear-gradient(90deg, #e74c3c, #ff6b6b); }
.hud-bar-mp .hud-bar-fill { background: linear-gradient(90deg, #3498db, #74b9ff); }

.hud-location {
  margin-left: auto;
  color: #c0a050;
  font-size: 14px;
  letter-spacing: 1px;
}

/* Battle UI */
.battle-screen {
  position: absolute;
  top: 0; left: 0;
  width: 960px; height: 640px;
  background: #000;
}

.battle-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

.battle-enemies {
  position: absolute;
  top: 80px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 40px;
}

.enemy-sprite {
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: all 0.2s;
}

.enemy-sprite.hit {
  filter: brightness(2);
  transform: scale(1.1);
}

.enemy-sprite.dead {
  opacity: 0.3;
  transform: translateY(20px);
}

.enemy-body {
  width: 80px;
  height: 80px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

.enemy-name {
  color: #fff;
  font-size: 12px;
  margin-top: 4px;
  text-shadow: 1px 1px 2px #000;
}

.enemy-hp-bar {
  width: 70px;
  height: 4px;
  background: #333;
  border-radius: 2px;
  margin-top: 2px;
  overflow: hidden;
}

.enemy-hp-fill {
  height: 100%;
  background: #e74c3c;
  border-radius: 2px;
  transition: width 0.3s;
}

.battle-party {
  position: absolute;
  bottom: 160px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 24px;
}

.party-member {
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0.6;
  transition: all 0.3s;
}

.party-member.active {
  opacity: 1;
  transform: translateY(-8px);
}

.party-member.dead {
  opacity: 0.3;
  filter: grayscale(1);
}

.party-sprite {
  width: 48px;
  height: 64px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

.party-member-name {
  color: #fff;
  font-size: 11px;
  margin-top: 2px;
  text-shadow: 1px 1px 2px #000;
}

.party-member-bars {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-top: 2px;
}

.party-bar {
  width: 60px;
  height: 4px;
  background: #333;
  border-radius: 2px;
  overflow: hidden;
}

.party-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s;
}

.battle-command {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 150px;
  background: linear-gradient(180deg, rgba(10,10,30,0.9) 0%, rgba(10,10,30,0.98) 100%);
  border-top: 2px solid #c0a050;
  display: flex;
  padding: 16px 24px;
  gap: 16px;
}

.battle-actor-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 180px;
}

.battle-actor-name {
  color: #e0c878;
  font-size: 16px;
  font-weight: bold;
}

.battle-actor-hp {
  color: #ff6b6b;
  font-size: 13px;
}

.battle-actor-mp {
  color: #74b9ff;
  font-size: 13px;
}

.battle-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: flex-start;
  flex: 1;
}

.battle-btn {
  background: rgba(192,160,80,0.15);
  border: 1px solid #887030;
  color: #e0c878;
  padding: 8px 20px;
  font-size: 14px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
  font-family: inherit;
  min-width: 100px;
  text-align: center;
}

.battle-btn:hover {
  background: rgba(192,160,80,0.35);
  border-color: #c0a050;
}

.battle-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.battle-btn.attack { border-color: #c0392b; }
.battle-btn.skill { border-color: #2980b9; }
.battle-btn.magic { border-color: #8e44ad; }
.battle-btn.item { border-color: #27ae60; }

.battle-skills-panel {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.skill-btn {
  background: rgba(41,128,185,0.15);
  border: 1px solid #2471a3;
  color: #aed6f1;
  padding: 6px 14px;
  font-size: 12px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
  font-family: inherit;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.skill-btn:hover {
  background: rgba(41,128,185,0.35);
}

.skill-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.skill-cost {
  color: #74b9ff;
  font-size: 11px;
}

/* Timing Ring */
.timing-ring-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  cursor: pointer;
}

.timing-ring {
  width: 200px;
  height: 200px;
  position: relative;
}

.timing-ring-outer {
  position: absolute;
  top: 0; left: 0;
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 3px solid rgba(192,160,80,0.5);
}

.timing-ring-zone {
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
}

.timing-ring-inner {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 3px solid #d4af37;
  background: rgba(212,175,55,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
}

.timing-ring-pointer {
  position: absolute;
  top: 50%; left: 50%;
  width: 90px; height: 3px;
  background: #fff;
  transform-origin: left center;
  border-radius: 2px;
}

.timing-ring-text {
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(0,0,0,0.8);
  text-align: center;
}

.timing-result {
  position: absolute;
  top: -40px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 24px;
  font-weight: bold;
  text-shadow: 0 0 20px currentColor;
  animation: timingPop 0.5s ease-out;
}

@keyframes timingPop {
  0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
  30% { transform: translateX(-50%) scale(1.3); opacity: 1; }
  100% { transform: translateX(-50%) scale(1); opacity: 0; }
}

.timing-result.perfect { color: #f1c40f; }
.timing-result.great { color: #2ecc71; }
.timing-result.good { color: #3498db; }
.timing-result.miss { color: #e74c3c; }

/* Stagger Bar */
.stagger-bar {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.stagger-label {
  color: #c0a050;
  font-size: 11px;
  letter-spacing: 1px;
}

.stagger-track {
  width: 200px;
  height: 8px;
  background: #333;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid #555;
}

.stagger-fill {
  height: 100%;
  background: linear-gradient(90deg, #f39c12, #f1c40f, #fff);
  border-radius: 4px;
  transition: width 0.3s;
}

/* Dialog */
.dialog-box {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 180px;
  background: linear-gradient(180deg, rgba(10,10,30,0.85) 0%, rgba(10,10,30,0.98) 100%);
  border-top: 2px solid #c0a050;
  padding: 20px 24px;
  color: #fff;
  display: flex;
  flex-direction: column;
}

.dialog-speaker {
  color: #e0c878;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 8px;
}

.dialog-text {
  font-size: 15px;
  line-height: 1.6;
  flex: 1;
  overflow-y: auto;
}

.dialog-continue {
  text-align: right;
  color: #888;
  font-size: 12px;
  margin-top: 8px;
  animation: blink 1s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.dialog-choices {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.dialog-choice {
  background: rgba(192,160,80,0.15);
  border: 1px solid #887030;
  color: #e0c878;
  padding: 6px 16px;
  font-size: 13px;
  cursor: pointer;
  border-radius: 4px;
  font-family: inherit;
  transition: all 0.2s;
}

.dialog-choice:hover {
  background: rgba(192,160,80,0.35);
}

/* Menu System */
.menu-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 960px; height: 640px;
  background: rgba(0,0,0,0.85);
  display: flex;
  color: #fff;
}

.menu-sidebar {
  width: 200px;
  background: linear-gradient(180deg, #1a0a2e 0%, #0a0a1a 100%);
  border-right: 2px solid #c0a050;
  padding: 16px 0;
  display: flex;
  flex-direction: column;
}

.menu-sidebar-title {
  color: #c0a050;
  font-size: 14px;
  letter-spacing: 2px;
  padding: 0 16px 12px;
  border-bottom: 1px solid #333;
  margin-bottom: 8px;
}

.menu-item {
  padding: 10px 16px;
  color: #aaa;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 14px;
}

.menu-item:hover, .menu-item.active {
  color: #e0c878;
  background: rgba(192,160,80,0.15);
}

.menu-item.active {
  border-left: 3px solid #d4af37;
}

.menu-content {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
}

/* Character Sheet */
.char-sheet {
  display: flex;
  gap: 24px;
}

.char-portrait {
  width: 200px;
  height: 240px;
  border-radius: 8px;
  border: 2px solid #c0a050;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 96px;
  background: rgba(26,10,46,0.8);
}

.char-info {
  flex: 1;
}

.char-name {
  font-size: 24px;
  color: #e0c878;
  font-weight: bold;
}

.char-class {
  font-size: 14px;
  color: #888;
  margin-bottom: 16px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px solid #222;
  font-size: 14px;
}

.stat-label { color: #aaa; }
.stat-value { color: #fff; }
.stat-bonus { color: #2ecc71; }

/* Skill Tree */
.skill-tree {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.skill-branch {
  background: rgba(26,10,46,0.5);
  border: 1px solid #333;
  border-radius: 8px;
  padding: 16px;
}

.skill-branch-title {
  color: #e0c878;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 12px;
}

.skill-nodes {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.skill-node {
  width: 60px;
  height: 60px;
  border-radius: 8px;
  border: 2px solid #555;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 24px;
  background: rgba(10,10,30,0.8);
}

.skill-node.unlocked {
  border-color: #2ecc71;
  background: rgba(46,204,113,0.1);
}

.skill-node.available {
  border-color: #f39c12;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 rgba(243,156,18,0); }
  50% { box-shadow: 0 0 15px rgba(243,156,18,0.3); }
}

.skill-node-req {
  font-size: 8px;
  color: #888;
  margin-top: 2px;
}

/* Battle Log */
.battle-log {
  position: absolute;
  top: 48px;
  left: 16px;
  width: 300px;
  max-height: 200px;
  overflow-y: auto;
  background: rgba(0,0,0,0.7);
  border-radius: 4px;
  padding: 8px;
}

.log-entry {
  color: #ccc;
  font-size: 12px;
  padding: 2px 0;
  animation: fadeIn 0.3s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.log-entry.damage { color: #ff6b6b; }
.log-entry.heal { color: #2ecc71; }
.log-entry.status { color: #f39c12; }
.log-entry.system { color: #74b9ff; }

/* Items/Inventory */
.inventory-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  padding: 8px;
}

.inventory-slot {
  width: 80px;
  height: 80px;
  border: 1px solid #444;
  border-radius: 4px;
  background: rgba(10,10,30,0.8);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 28px;
  position: relative;
}

.inventory-slot:hover {
  border-color: #c0a050;
  background: rgba(192,160,80,0.1);
}

.inventory-slot.selected {
  border-color: #d4af37;
  box-shadow: 0 0 10px rgba(212,175,55,0.3);
}

.inventory-slot-count {
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 11px;
  color: #ccc;
}

.item-tooltip {
  position: absolute;
  background: rgba(10,10,30,0.95);
  border: 1px solid #c0a050;
  border-radius: 4px;
  padding: 8px 12px;
  color: #fff;
  font-size: 12px;
  z-index: 100;
  min-width: 160px;
}

.item-tooltip-name {
  color: #e0c878;
  font-weight: bold;
  margin-bottom: 4px;
}

.item-tooltip-desc {
  color: #aaa;
  font-size: 11px;
  margin-bottom: 4px;
}

.item-tooltip-stat {
  color: #2ecc71;
  font-size: 11px;
}

/* Quest Tracker */
.quest-tracker {
  position: absolute;
  top: 56px;
  right: 16px;
  width: 240px;
  background: rgba(0,0,0,0.7);
  border-radius: 4px;
  padding: 12px;
}

.quest-tracker-title {
  color: #c0a050;
  font-size: 12px;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.quest-entry {
  margin-bottom: 8px;
}

.quest-entry-name {
  color: #fff;
  font-size: 12px;
  font-weight: bold;
}

.quest-entry-desc {
  color: #aaa;
  font-size: 11px;
  margin-top: 2px;
}

/* Crafting */
.crafting-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.crafting-recipe {
  background: rgba(26,10,46,0.5);
  border: 1px solid #333;
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.crafting-recipe:hover {
  border-color: #c0a050;
}

.crafting-recipe.can-craft {
  border-color: #2ecc71;
}

.crafting-recipe-name {
  color: #e0c878;
  font-weight: bold;
  font-size: 14px;
}

.crafting-recipe-mats {
  margin-top: 8px;
  font-size: 12px;
  color: #aaa;
}

.mat-available { color: #2ecc71; }
.mat-unavailable { color: #e74c3c; }

/* Notification */
.notification {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10,10,30,0.9);
  border: 1px solid #c0a050;
  border-radius: 8px;
  padding: 12px 24px;
  color: #e0c878;
  font-size: 14px;
  animation: notifSlide 0.3s ease-out, notifFade 0.3s ease-in 2s forwards;
  z-index: 200;
  pointer-events: none;
}

@keyframes notifSlide {
  from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}

@keyframes notifFade {
  to { opacity: 0; }
}

/* Damage Numbers */
.dmg-number {
  position: absolute;
  font-size: 20px;
  font-weight: bold;
  pointer-events: none;
  animation: dmgFloat 1s ease-out forwards;
  text-shadow: 2px 2px 4px #000;
  z-index: 150;
}

@keyframes dmgFloat {
  0% { transform: translateY(0) scale(0.5); opacity: 1; }
  50% { transform: translateY(-30px) scale(1.2); }
  100% { transform: translateY(-50px) scale(1); opacity: 0; }
}

/* Game Over */
.gameover-screen {
  position: absolute;
  top: 0; left: 0;
  width: 960px; height: 640px;
  background: rgba(30,0,0,0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.gameover-text {
  font-size: 48px;
  color: #c0392b;
  letter-spacing: 8px;
  text-shadow: 0 0 30px rgba(192,57,43,0.5);
  margin-bottom: 32px;
}

.gameover-sub {
  color: #888;
  font-size: 14px;
  margin-bottom: 24px;
}

/* Scrollbar */

(function() {
"use strict";

// ==========================================
// ERROR BOUNDARY & LOGGING
// ==========================================
const _errorLog = [];
const _maxLogEntries = 50;

function _logError(source, msg, err) {
  const entry = {
    time: new Date().toISOString().slice(11, 19),
    source: source,
    message: msg,
    stack: err ? err.stack || '' : '',
    id: _errorLog.length
  };
  _errorLog.push(entry);
  if (_errorLog.length > _maxLogEntries) _errorLog.shift();
  console.error('[' + source + '] ' + msg, err || '');
}

// Global uncaught error handler
window.addEventListener('error', function(e) {
  _logError('UNCAUGHT', e.message, e.error);
  _showErrorOverlay(e.message, e.filename, e.lineno);
  return true;
});

window.addEventListener('unhandledrejection', function(e) {
  _logError('PROMISE_REJECTION', String(e.reason), null);
  _showErrorOverlay('Unhandled Promise: ' + String(e.reason));
  return true;
});

function _showErrorOverlay(msg, file, line) {
  // Don't show overlay for minor warnings
  if (msg && msg.includes('ResizeObserver')) return;

  let overlay = document.getElementById('game-error-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'game-error-overlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:rgba(30,0,0,0.95);color:#ff6b6b;padding:12px 20px;font-family:monospace;font-size:13px;border-bottom:2px solid #c0392b;display:flex;align-items:center;gap:12px;cursor:pointer;max-height:120px;overflow:auto;';
    overlay.innerHTML = '<span style="font-size:18px">⚠️</span><div style="flex:1"><b>Runtime Error</b><div id="game-error-msg" style="color:#ddd;margin-top:4px;word-break:break-all"></div><div id="game-error-loc" style="color:#888;font-size:11px;margin-top:2px"></div></div><span style="color:#888;font-size:11px">Click to dismiss</span>';
    overlay.addEventListener('click', function() { overlay.style.display = 'none'; });
    document.body.appendChild(overlay);
  }

  document.getElementById('game-error-msg').textContent = msg || 'Unknown error';
  document.getElementById('game-error-loc').textContent = file ? (file.split('/').pop() + (line ? ':' + line : '')) : '';
  overlay.style.display = 'flex';
  // Auto-hide after 8 seconds
  clearTimeout(overlay._hideTimer);
  overlay._hideTimer = setTimeout(function() { overlay.style.display = 'none'; }, 8000);
}

// Utility: safe wrapper for game functions
function _safe(fn, fallback) {
  return function() {
    try {
      return fn.apply(this, arguments);
    } catch(e) {
      _logError('GAME', e.message, e);
      _showErrorOverlay(e.message);
      return fallback !== undefined ? fallback : null;
    }
  };
}

// ==========================================
// Chronicles of the Fallen Crown - Game State
// ==========================================





class GameState {
  constructor() {
    this.screen = 'title'; // title, exploring, battle, dialog, menu, gameover, victory
    this.currentArea = 'verdant_woods';
    this.playerPos = { x: 14, y: 18 };
    this.playerDir = 'up'; // up, down, left, right
    this.playerMoving = false;
    this.animFrame = 0;
    this.animTimer = 0;

    // Party
    this.party = this.createInitialParty();
    this.activePartyMembers = ['cedric', 'lyra', 'aldous'];
    this.reserveParty = ['rowan', 'mira', 'dorin', 'seraphina'];

    // Inventory
    this.inventory = this.createInitialInventory();
    this.gold = 200;

    // Quests
    this.activeQuests = ['main_capital_run'];
    this.completedQuests = [];
    this.questProgress = {};
    this.flags = {};

    // Stats tracking
    this.stats = {
      battlesWon: 0,
      enemiesDefeated: {},
      itemsCrafted: 0,
      totalDamage: 0,
      playTime: 0,
    };

    // Opened chests
    this.openedChests = new Set();

    // Dialog
    this.currentDialog = null;
    this.dialogIndex = 0;

    // Menu
    this.menuTab = 'party';
    this.selectedCharacter = 'cedric';
    this.selectedSkillBranch = 0;

    // Battle
    this.battleState = null;

    // Notification queue
    this.notifications = [];

    // World flags for generated tile maps
    this.worldFlags = {};

    // Unlocked waystones
    this.unlockedWaystones = new Set(['vs_verdant']);

    // Notification timer
    this._notifTimer = 0;
  }

  createInitialParty() {
    const party = {};
    for (const [id, char] of Object.entries(CHARACTERS)) {
      party[id] = {
        ...char,
        level: 1,
        exp: 0,
        expToNext: 30,
        currentHp: char.baseStats.hp,
        currentMp: char.baseStats.mp,
        maxHp: char.baseStats.hp,
        maxMp: char.baseStats.mp,
        stats: { ...char.baseStats },
        equipment: { weapon: null, armor: null, accessory: null },
        statusEffects: [],
        unlockedSkills: [char.skills[0].id, char.skills[1].id], // First two skills unlocked
        skillPoints: 0,
        affection: 0,
      };
    }
    return party;
  }

  createInitialInventory() {
    return {
      'hp_potion': 5,
      'mp_potion': 3,
      'antidote': 2,
      'smoke_bomb': 1,
    };
  }

  // ============ LEVELING ============
  addExp(memberId, amount) {
    const member = this.party[memberId];
    if (!member || member.currentHp <= 0) return;

    member.exp += amount;
    const messages = [];

    while (member.exp >= member.expToNext) {
      member.exp -= member.expToNext;
      member.level++;
      member.expToNext = Math.floor(30 * Math.pow(1.3, member.level - 1));
      member.skillPoints++;

      // Apply growth rates
      for (const [stat, growth] of Object.entries(member.growthRates)) {
        member.stats[stat] += growth;
        if (stat === 'hp') { member.maxHp += growth; member.currentHp += growth; }
        if (stat === 'mp') { member.maxMp += growth; member.currentMp += growth; }
      }

      // Job class evolution at level 30
      if (member.level === 30) {
        messages.push(`${member.name} has reached the pinnacle! Class evolution available!`);
      } else {
        messages.push(`${member.name} leveled up to ${member.level}!`);
      }
    }

    return messages;
  }

  addExpToParty(amount) {
    const messages = [];
    for (const id of this.activePartyMembers) {
      const msgs = this.addExp(id, amount);
      if (msgs) messages.push(...msgs);
    }
    return messages;
  }

  // ============ INVENTORY ============
  addItem(itemId, qty = 1) {
    this.inventory[itemId] = (this.inventory[itemId] || 0) + qty;
  }

  removeItem(itemId, qty = 1) {
    if ((this.inventory[itemId] || 0) >= qty) {
      this.inventory[itemId] -= qty;
      if (this.inventory[itemId] <= 0) delete this.inventory[itemId];
      return true;
    }
    return false;
  }

  hasItem(itemId, qty = 1) {
    return (this.inventory[itemId] || 0) >= qty;
  }

  useItem(itemId, targetId) {
    const item = ITEMS[itemId];
    if (!item || item.type !== 'consumable') return false;

    switch (item.subtype) {
      case 'heal_hp': {
        const target = this.party[targetId];
        if (!target || target.currentHp <= 0) return false;
        target.currentHp = Math.min(target.maxHp, target.currentHp + item.value);
        this.removeItem(itemId);
        return { message: `${target.name} recovered ${item.value} HP!`, type: 'heal' };
      }
      case 'heal_mp': {
        const target = this.party[targetId];
        if (!target || target.currentHp <= 0) return false;
        target.currentMp = Math.min(target.maxMp, target.currentMp + item.value);
        this.removeItem(itemId);
        return { message: `${target.name} recovered ${item.value} MP!`, type: 'heal' };
      }
      case 'heal_full': {
        const target = this.party[targetId];
        if (!target || target.currentHp <= 0) return false;
        target.currentHp = target.maxHp;
        target.currentMp = target.maxMp;
        this.removeItem(itemId);
        return { message: `${target.name} fully restored!`, type: 'heal' };
      }
      case 'revive': {
        const target = this.party[targetId];
        if (!target || target.currentHp > 0) return false;
        target.currentHp = Math.floor(target.maxHp * item.value);
        this.removeItem(itemId);
        return { message: `${target.name} has been revived!`, type: 'heal' };
      }
      case 'cure_status': {
        const target = this.party[targetId];
        if (!target) return false;
        target.statusEffects = target.statusEffects.filter(s => s.type !== item.status);
        this.removeItem(itemId);
        return { message: `${target.name}'s ${item.status} was cured!`, type: 'status' };
      }
    }
    return false;
  }

  // ============ EQUIPMENT ============
  equipItem(memberId, itemId) {
    const member = this.party[memberId];
    const item = ITEMS[itemId];
    if (!member || !item || item.type !== 'equipment') return false;

    const oldEquip = member.equipment[item.slot];
    if (oldEquip) this.addItem(oldEquip);
    this.removeItem(itemId);
    member.equipment[item.slot] = itemId;

    this.recalcStats(memberId);
    return true;
  }

  unequipItem(memberId, slot) {
    const member = this.party[memberId];
    if (!member || !member.equipment[slot]) return false;

    this.addItem(member.equipment[slot]);
    member.equipment[slot] = null;
    this.recalcStats(memberId);
    return true;
  }

  recalcStats(memberId) {
    const member = this.party[memberId];
    if (!member) return;

    // Start from base stats + growth
    const base = { ...CHARACTERS[member.id].baseStats };
    for (let i = 1; i < member.level; i++) {
      for (const [stat, growth] of Object.entries(CHARACTERS[member.id].growthRates)) {
        base[stat] += growth;
      }
    }

    // Add equipment bonuses
    for (const slot of ['weapon', 'armor', 'accessory']) {
      const eqId = member.equipment[slot];
      if (eqId) {
        const eq = ITEMS[eqId];
        for (const [stat, val] of Object.entries(eq)) {
          if (stat in base && typeof val === 'number') {
            base[stat] += val;
          }
        }
      }
    }

    member.stats = base;
    member.maxHp = base.hp;
    member.maxMp = base.mp;
    member.currentHp = Math.min(member.currentHp, member.maxHp);
    member.currentMp = Math.min(member.currentMp, member.maxMp);
  }

  // ============ QUESTS ============
  activateQuest(questId) {
    if (!this.activeQuests.includes(questId) && !this.completedQuests.includes(questId)) {
      this.activeQuests.push(questId);
      this.questProgress[questId] = { stage: 0, counters: {} };
      const quest = QUESTS[questId];
      if (quest) {
        this.showNotification(`New Quest: ${quest.name}`);
      }
    }
  }

  advanceQuest(questId, stage) {
    if (!this.activeQuests.includes(questId)) return;
    const progress = this.questProgress[questId] || { stage: 0, counters: {} };
    progress.stage = Math.max(progress.stage, stage || 0);
    this.questProgress[questId] = progress;
  }

  completeQuest(questId) {
    const quest = QUESTS[questId];
    if (!quest) return;

    this.activeQuests = this.activeQuests.filter(q => q !== questId);
    this.completedQuests.push(questId);

    // Grant rewards
    if (quest.rewards.exp) this.addExpToParty(quest.rewards.exp);
    if (quest.rewards.gold) this.gold += quest.rewards.gold;
    if (quest.rewards.items) {
      for (const item of quest.rewards.items) {
        this.addItem(item.id, item.qty);
      }
    }

    this.showNotification(`Quest Complete: ${quest.name}!`);
  }

  // ============ FLAGS ============
  setFlag(flag, value = true) {
    this.flags[flag] = value;
  }

  hasFlag(flag) {
    return this.flags[flag] === true;
  }

  // ============ NOTIFICATIONS ============
  showNotification(text) {
    this.notifications.push({ text, timer: 3000 });
  }

  // ============ SAVE/LOAD ============
  saveGame() {
    const saveData = {
      currentArea: this.currentArea,
      playerPos: this.playerPos,
      party: this.party,
      activePartyMembers: this.activePartyMembers,
      reserveParty: this.reserveParty,
      inventory: this.inventory,
      gold: this.gold,
      activeQuests: this.activeQuests,
      completedQuests: this.completedQuests,
      questProgress: this.questProgress,
      flags: this.flags,
      stats: this.stats,
      openedChests: [...this.openedChests],
      unlockedWaystones: [...this.unlockedWaystones],
    };
    localStorage.setItem('cotfc_save', JSON.stringify(saveData));
    this.showNotification('Game saved!');
  }

  loadGame() {
    const data = localStorage.getItem('cotfc_save');
    if (!data) return false;

    try {
      const save = JSON.parse(data);
      this.currentArea = save.currentArea;
      this.playerPos = save.playerPos;
      this.party = save.party;
      this.activePartyMembers = save.activePartyMembers;
      this.reserveParty = save.reserveParty;
      this.inventory = save.inventory;
      this.gold = save.gold;
      this.activeQuests = save.activeQuests;
      this.completedQuests = save.completedQuests;
      this.questProgress = save.questProgress;
      this.flags = save.flags;
      this.stats = save.stats;
      this.openedChests = new Set(save.openedChests);
      this.unlockedWaystones = new Set(save.unlockedWaystones);
      this.screen = 'exploring';
      this.showNotification('Game loaded!');
      return true;
    } catch (e) {
      console.error('Failed to load save:', e);
      return false;
    }
  }

  hasSaveGame() {
    return !!localStorage.getItem('cotfc_save');
  }

  resetGame() {
    this.party = this.createInitialParty();
    this.activePartyMembers = ['cedric', 'lyra', 'aldous'];
    this.reserveParty = ['rowan', 'mira', 'dorin', 'seraphina'];
    this.inventory = this.createInitialInventory();
    this.gold = 200;
    this.currentArea = 'verdant_woods';
    this.playerPos = { x: 14, y: 18 };
    this.activeQuests = ['main_capital_run'];

// ---------- HELPERS ----------
const _spriteCache = {};

function makeSprite(rows, scale) {
  const h = rows.length;
  const w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w * scale;
  c.height = h * scale;
  const ctx = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < w; x++) {
      const col = PALETTE[row[x]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x * scale, y * scale, scale, scale);
    }
  }
  return c;
}

function getSprite(key, rows, scale) {
  if (!_spriteCache[key]) {
    _spriteCache[key] = makeSprite(rows, scale || 3);
  }
  return _spriteCache[key];
}

function drawSprite(ctx, canvas, x, y, w, h) {
  if (!canvas) return;
  if (w === undefined) { w = canvas.width; h = canvas.height; }
  ctx.drawImage(canvas, Math.round(x), Math.round(y), w, h);
}

  else if (id.indexOf('merchant') === 0 || id.indexOf('herbalist') === 0) key = 'merchant';
  else if (id.indexOf('scholar') === 0 || id.indexOf('bard') === 0) key = 'scholar';

  return getSprite('npc_' + key, NPC_SPRITE_ROWS[key], 3);

function getTileSprite(tileType) {
  const key = 'tile_' + tileType;
  if (!_spriteCache[key]) {
    // Water gets two frames for animation
    if (tileType === 'water') {
      const frameA = makeSprite(TILE_SPRITE_ROWS.water, 2);
      const frameB = makeSprite(TILE_SPRITE_ROWS.water_foam, 2);
      _spriteCache[key] = { a: frameA, b: frameB };
    } else {
      _spriteCache[key] = makeSprite(TILE_SPRITE_ROWS[tileType] || TILE_SPRITE_ROWS.grass, 2);
    }
  }
  return _spriteCache[key];
}

// ==========================================



const TILE_SIZE = 32;
const VIEWPORT_W = 960;
const VIEWPORT_H = 640;

// Pseudorandom seeded generator
function seededRandom(seed) {
  let s = seed;
  return function () {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

class World {
  constructor() {
    this.tileMaps = {};
    this.animTime = 0;
    this.particleEffects = [];
  }

  getTileMap(areaId) {
    if (this.tileMaps[areaId]) return this.tileMaps[areaId];
    const area = AREAS[areaId];
    if (!area) return null;
    if (area.generated) {
      this.tileMaps[areaId] = this.generateMap(area, areaId);
    }
    return this.tileMaps[areaId];
  }

  generateMap(area, areaId) {
    const w = area.width;
    const h = area.height;
    const tiles = [];
    const seed = this.hashCode(areaId);
    const rng = seededRandom(Math.abs(seed) + 1);

    // Fill base tiles based on area type
    for (let y = 0; y < h; y++) {
      tiles[y] = [];
      for (let x = 0; x < w; x++) {
        if (area.type === 'outdoor') {
          tiles[y][x] = T.GRASS;
        } else if (area.type === 'town') {
          tiles[y][x] = T.FLOOR;
        } else {
          tiles[y][x] = T.FLOOR;
        }
      }
    }

    // Add borders/walls
    for (let x = 0; x < w; x++) {
      tiles[0][x] = T.WALL;
      tiles[h - 1][x] = T.WALL;
    }
    for (let y = 0; y < h; y++) {
      tiles[y][0] = T.WALL;
      tiles[y][w - 1] = T.WALL;
    }

    // Add natural features based on area type
    if (area.type === 'outdoor') {
      // Trees
      for (let i = 0; i < w * h * 0.15; i++) {
        const x = Math.floor(rng() * (w - 2)) + 1;
        const y = Math.floor(rng() * (h - 2)) + 1;
        if (tiles[y][x] === T.GRASS && !this.isNearPlayerStart(x, y, area)) {
          tiles[y][x] = T.TREE;
        }
      }
      // Rocks
      for (let i = 0; i < w * h * 0.03; i++) {
        const x = Math.floor(rng() * (w - 2)) + 1;
        const y = Math.floor(rng() * (h - 2)) + 1;
        if (tiles[y][x] === T.GRASS && !this.isNearPlayerStart(x, y, area)) {
          tiles[y][x] = T.ROCK;
        }
      }
      // Flowers
      for (let i = 0; i < w * h * 0.05; i++) {
        const x = Math.floor(rng() * (w - 2)) + 1;
        const y = Math.floor(rng() * (h - 2)) + 1;
        if (tiles[y][x] === T.GRASS) {
          tiles[y][x] = T.FLOWER;
        }
      }
      // Water patches
      for (let i = 0; i < 3; i++) {
        const cx = Math.floor(rng() * (w - 6)) + 3;
        const cy = Math.floor(rng() * (h - 6)) + 3;
        const size = Math.floor(rng() * 2) + 1;
        for (let dy = -size; dy <= size; dy++) {
          for (let dx = -size; dx <= size; dx++) {
            const nx = cx + dx, ny = cy + dy;
            if (nx > 0 && nx < w - 1 && ny > 0 && ny < h - 1) {
              if (dx * dx + dy * dy <= size * size) {
                tiles[ny][nx] = T.WATER;
              }
            }
          }
        }
      }
    } else if (area.type === 'dungeon') {
      // Add walls to create corridors
      const rooms = [];
      for (let i = 0; i < 6; i++) {
        const rx = Math.floor(rng() * (w - 10)) + 3;
        const ry = Math.floor(rng() * (h - 10)) + 3;
        const rw = Math.floor(rng() * 5) + 4;
        const rh = Math.floor(rng() * 4) + 3;
        rooms.push({ x: rx, y: ry, w: rw, h: rh });

        // Carve room
        for (let dy = 0; dy < rh; dy++) {
          for (let dx = 0; dx < rw; dx++) {
            const nx = rx + dx, ny = ry + dy;
            if (nx > 0 && nx < w - 1 && ny > 0 && ny < h - 1) {
              tiles[ny][nx] = T.FLOOR;
            }
          }
        }
      }

      // Fill unused space with walls
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          if (tiles[y][x] === T.FLOOR) continue;
          tiles[y][x] = T.WALL;
        }
      }

      // Connect rooms with corridors
      for (let i = 0; i < rooms.length - 1; i++) {
        const a = rooms[i], b = rooms[i + 1];
        const ax = Math.floor(a.x + a.w / 2);
        const ay = Math.floor(a.y + a.h / 2);
        const bx = Math.floor(b.x + b.w / 2);
        const by = Math.floor(b.y + b.h / 2);

        // Horizontal then vertical
        let cx = ax;
        while (cx !== bx) {
          if (ay > 0 && ay < h - 1 && cx > 0 && cx < w - 1) {
            tiles[ay][cx] = T.FLOOR;
          }
          cx += cx < bx ? 1 : -1;
        }
        let cy = ay;
        while (cy !== by) {
          if (cy > 0 && cy < h - 1 && bx > 0 && bx < w - 1) {
            tiles[cy][bx] = T.FLOOR;
          }
          cy += cy < by ? 1 : -1;
        }
      }
    } else if (area.type === 'town') {
      // Add buildings (walls) with doors
      const buildings = [];
      for (let i = 0; i < 5; i++) {
        const bx = Math.floor(rng() * (w - 8)) + 2;
        const by = Math.floor(rng() * (h - 8)) + 2;
        const bw = Math.floor(rng() * 3) + 3;
        const bh = Math.floor(rng() * 2) + 3;
        buildings.push({ x: bx, y: by, w: bw, h: bh });

        // Building walls
        for (let dy = 0; dy < bh; dy++) {
          for (let dx = 0; dx < bw; dx++) {
            const nx = bx + dx, ny = by + dy;
            if (nx > 0 && nx < w - 1 && ny > 0 && ny < h - 1) {
              if (dy === 0 || dy === bh - 1 || dx === 0 || dx === bw - 1) {
                tiles[ny][nx] = T.WALL;
              } else {
                tiles[ny][nx] = T.FLOOR;
              }
            }
          }
        }

        // Door
        const doorX = bx + Math.floor(bw / 2);
        const doorY = by + bh - 1;
        if (doorY < h - 1 && doorX > 0 && doorX < w - 1) {
          tiles[doorY][doorX] = T.DOOR;
        }
      }

      // Paths
      for (let x = 1; x < w - 1; x++) {
        if (tiles[Math.floor(h / 2)][x] === T.GRASS || tiles[Math.floor(h / 2)][x] === T.FLOWER) {
          tiles[Math.floor(h / 2)][x] = T.PATH;
        }
      }
      for (let y = 1; y < h - 1; y++) {
        if (tiles[y][Math.floor(w / 2)] === T.GRASS || tiles[y][Math.floor(w / 2)] === T.FLOWER) {
          tiles[y][Math.floor(w / 2)] = T.PATH;
        }
      }
    }

    // Clear around player start
    const px = area.playerStart.x;
    const py = area.playerStart.y;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const nx = px + dx, ny = py + dy;
        if (nx > 0 && nx < w - 1 && ny > 0 && ny < h - 1) {
          if (tiles[ny][nx] !== T.FLOOR && tiles[ny][nx] !== T.PATH) {
            tiles[ny][nx] = area.type === 'outdoor' ? T.GRASS : T.FLOOR;
          }
        }
      }
    }

    // Place special tiles
    // Exits
    for (const exit of (area.exits || [])) {
      if (exit.x >= 0 && exit.x < w && exit.y >= 0 && exit.y < h) {
        tiles[exit.y][exit.x] = T.DOOR;
      }
    }

    // Chests
    for (const chest of (area.chests || [])) {
      if (chest.x >= 0 && chest.x < w && chest.y >= 0 && chest.y < h) {
        tiles[chest.y][chest.x] = T.CHEST;
      }
    }

    // NPCs
    for (const npc of (area.npcs || [])) {
      if (npc.x >= 0 && npc.x < w && npc.y >= 0 && npc.y < h) {
        tiles[npc.y][npc.x] = T.NPC;
      }
    }

    // Signs
    for (const sign of (area.signs || [])) {
      if (sign.x >= 0 && sign.x < w && sign.y >= 0 && sign.y < h) {
        tiles[sign.y][sign.x] = T.SIGN;
      }
    }

    // Waystones
    for (const ws of (area.waystones || [])) {
      if (ws.x >= 0 && ws.x < w && ws.y >= 0 && ws.y < h) {
        tiles[ws.y][ws.x] = T.WAYSTONE;
      }
    }

    // Crafting benches
    for (const cb of (area.craftingBenches || [])) {
      if (cb.x >= 0 && cb.x < w && cb.y >= 0 && cb.y < h) {
        tiles[cb.y][cb.x] = T.CRAFT;
      }
    }

    // Shops
    for (const shop of (area.shops || [])) {
      if (shop.x >= 0 && shop.x < w && shop.y >= 0 && shop.y < h) {
        tiles[shop.y][shop.x] = T.SHOP;
      }
    }

    // Boss
    if (area.bossEncounter) {
      const be = area.bossEncounter;
      if (be.x >= 0 && be.x < w && be.y >= 0 && be.y < h) {
        tiles[be.y][be.x] = T.BOSS;
      }
    }

    // Save points (always near waystones)
    for (const ws of (area.waystones || [])) {
      if (ws.x > 0 && ws.x < w - 1) {
        tiles[ws.y][ws.x + 1] = T.SAVE;
      }
    }

    return tiles;
  }

  isNearPlayerStart(x, y, area) {
    const dx = Math.abs(x - area.playerStart.x);
    const dy = Math.abs(y - area.playerStart.y);
    return dx < 3 && dy < 3;
  }

  hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      const char = str.charCodeAt(i);
      hash = ((hash << 5) - hash) + char;
      hash |= 0;
    }
    return hash;
  }

  isBlocking(tiles, x, y) {
    if (!tiles || y < 0 || y >= tiles.length || x < 0 || x >= tiles[0].length) return true;
    return BLOCKING_TILES.has(tiles[y][x]);
  }

  isInteractable(tiles, x, y) {
    if (!tiles || y < 0 || y >= tiles.length || x < 0 || x >= tiles[0].length) return false;
    return INTERACTABLE_TILES.has(tiles[y][x]);
  }

  render(ctx, state, cameraX, cameraY) {
    const area = AREAS[state.currentArea];
    const tiles = this.getTileMap(state.currentArea);
    if (!area || !tiles) return;

    this.animTime += 0.02;

    const startTileX = Math.max(0, Math.floor(cameraX / TILE_SIZE));
    const startTileY = Math.max(0, Math.floor(cameraY / TILE_SIZE));
    const endTileX = Math.min(area.width, Math.ceil((cameraX + VIEWPORT_W) / TILE_SIZE) + 1);
    const endTileY = Math.min(area.height, Math.ceil((cameraY + VIEWPORT_H) / TILE_SIZE) + 1);

    // Render tiles
    for (let y = startTileY; y < endTileY; y++) {
      for (let x = startTileX; x < endTileX; x++) {
        const tile = tiles[y][x];
        const screenX = x * TILE_SIZE - cameraX;
        const screenY = y * TILE_SIZE - cameraY;

        // Draw pixel-art tile sprite
        const spriteKey = TILE_SPRITE_MAP[tile] || 'grass';
        const tileSprite = getTileSprite(spriteKey);

        // Water animation (two frames)
        if (spriteKey === 'water') {
          const frame = (Math.floor(this.animTime * 4 + x + y) % 2 === 0) ? tileSprite.a : tileSprite.b;
          drawSprite(ctx, frame, screenX, screenY, TILE_SIZE, TILE_SIZE);
        } else {
          drawSprite(ctx, tileSprite, screenX, screenY, TILE_SIZE, TILE_SIZE);
        }

        // Glow overlays for special tiles
        if (tile === T.WAYSTONE) {
          const glow = Math.sin(this.animTime * 4) * 30 + 20;
          ctx.fillStyle = 'rgba(58,90,154,' + (glow / 255) + ')';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        } else if (tile === T.SAVE) {
          const glow = Math.sin(this.animTime * 3 + 1) * 20 + 10;
          ctx.fillStyle = 'rgba(42,106,74,' + (glow / 255) + ')';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        } else if (tile === T.BOSS) {
          const pulse = Math.sin(this.animTime * 3) * 0.2 + 0.2;
          ctx.fillStyle = 'rgba(138,26,26,' + pulse + ')';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        }
      }
    }

    // Render NPCs with names
    for (const npc of (area.npcs || [])) {
      const screenX = npc.x * TILE_SIZE - cameraX;
      const screenY = npc.y * TILE_SIZE - cameraY;
      if (screenX > -TILE_SIZE && screenX < VIEWPORT_W + TILE_SIZE &&
        screenY > -TILE_SIZE && screenY < VIEWPORT_H + TILE_SIZE) {
        // NPC body
        ctx.font = '22px serif';
        ctx.textAlign = 'center';
        // NPC pixel-art sprite
        drawSprite(ctx, getNpcSprite(npc.id), screenX + 2, screenY, TILE_SIZE - 4, TILE_SIZE - 2);

        // Name label
        ctx.font = '10px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(npc.name, screenX + TILE_SIZE / 2, screenY - 6);

        // Interaction hint
        const dx = Math.abs(state.playerPos.x - npc.x);
        const dy = Math.abs(state.playerPos.y - npc.y);
        if (dx + dy <= 2) {
          ctx.fillStyle = 'rgba(212,175,55,0.9)';
          ctx.fillText('[E] Talk', screenX + TILE_SIZE / 2, screenY + TILE_SIZE + 10);
        }
      }
    }

    // Render player
    const playerScreenX = state.playerPos.x * TILE_SIZE - cameraX;
    const playerScreenY = state.playerPos.y * TILE_SIZE - cameraY;
    const bobY = Math.sin(this.animTime * 5) * 1.5;

    // Player shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(playerScreenX + TILE_SIZE / 2, playerScreenY + TILE_SIZE - 2, 10, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Player pixel-art sprite (party leader)
    const leaderId = state.activePartyMembers && state.activePartyMembers[0] ? state.activePartyMembers[0] : 'cedric';
    drawSprite(ctx, getCharacterSprite(leaderId),
      playerScreenX + TILE_SIZE / 2 - 18, playerScreenY + TILE_SIZE / 2 - 22 + bobY, 36, 45);

    // Direction indicator
    const dirOffsets = { up: [0, -10], down: [0, 10], left: [-10, 0], right: [10, 0] };
    const [dx, dy] = dirOffsets[state.playerDir];
    ctx.fillStyle = 'rgba(212,175,55,0.6)';
    ctx.beginPath();
    ctx.moveTo(playerScreenX + TILE_SIZE / 2 + dx * 0.3, playerScreenY + TILE_SIZE / 2 + dy * 0.3);
    ctx.lineTo(playerScreenX + TILE_SIZE / 2 + dx * 0.8, playerScreenY + TILE_SIZE / 2 + dy * 0.8);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#d4af37';
    ctx.stroke();

    // Render minimap
    this.renderMinimap(ctx, area, tiles, state);

    // Render area name (fade in/out)
    this.renderAreaLabel(ctx, area);

    // Render particles
    this.updateParticles(ctx, cameraX, cameraY);
  }

  renderMinimap(ctx, area, tiles, state) {
    const mmX = VIEWPORT_W - 160;
    const mmY = VIEWPORT_H - 120;
    const mmW = 148;
    const mmH = 108;
    const scale = Math.min(mmW / area.width, mmH / area.height);

    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(mmX, mmY, mmW, mmH);
    ctx.strokeStyle = '#c0a050';
    ctx.strokeRect(mmX, mmY, mmW, mmH);

    // Title
    ctx.fillStyle = '#c0a050';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('MAP', mmX + 4, mmY - 4);

    // Tiles (simplified)
    for (let y = 0; y < area.height; y++) {
      for (let x = 0; x < area.width; x++) {
        const tile = tiles[y][x];
        let color;
        if (tile === T.WALL || tile === T.TREE || tile === T.ROCK) color = '#555';
        else if (tile === T.WATER) color = '#2a4a8a';
        else if (tile === T.DOOR || tile === T.EXIT) color = '#c0a030';
        else if (tile === T.BOSS) color = '#ff0000';
        else if (tile === T.CHEST) color = '#ffd700';
        else color = '#3a5a3a';

        ctx.fillStyle = color;
        ctx.fillRect(
          mmX + x * scale,
          mmY + y * scale,
          Math.max(1, scale),
          Math.max(1, scale)
        );
      }
    }

    // Player position
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(
      mmX + state.playerPos.x * scale - 1,
      mmY + state.playerPos.y * scale - 1,
      3, 3
    );
  }

  _areaNameAlpha = 1;
  _lastArea = '';
  renderAreaLabel(ctx, area) {
    if (this._lastArea !== area.id) {
      this._lastArea = area.id;
      this._areaNameAlpha = 1;
    }
    if (this._areaNameAlpha > 0) {
      ctx.globalAlpha = Math.min(1, this._areaNameAlpha);
      ctx.fillStyle = '#c0a050';
      ctx.font = 'bold 24px serif';
      ctx.textAlign = 'center';
      ctx.fillText(area.name, VIEWPORT_W / 2, 80);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#aaa';
      ctx.fillText(area.description, VIEWPORT_W / 2, 102);
      ctx.globalAlpha = 1;
      this._areaNameAlpha -= 0.005;
    }
  }

  addParticle(x, y, color, life = 60) {
    this.particleEffects.push({ x, y, color, life, maxLife: life, vx: (Math.random() - 0.5) * 2, vy: -Math.random() * 2 });
  }

  updateParticles(ctx, cameraX, cameraY) {
    this.particleEffects = this.particleEffects.filter(p => {
      p.life--;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - cameraX, p.y - cameraY, 3, 3);
      ctx.globalAlpha = 1;
      return p.life > 0;
    });
  }

  adjustColor(hex, amount) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, Math.min(255, r + amount));
    g = Math.max(0, Math.min(255, g + amount));
    b = Math.max(0, Math.min(255, b + amount));
    return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
  }
}
